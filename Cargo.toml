[package]
name = "mavlink-tlog"
version = "0.1.2"
authors = ["Matt Busel <matt@busel.dev>"]
edition = "2021"
rust-version = "1.70"
description = "Your telemetry tools make up messages when a log is damaged. On a damaged public log pymavlink reports 5 phantom system-0 messages and drops 22 real frames; mavlink-tlog invents none and reads the 22. MAVLink .tlog logs (QGroundControl, Mission Planner, MAVProxy) read and written with every frame checked against the CRC of all 353 all.xml messages, damaged bytes refused and counted, per-sender packet loss"
license = "MIT"
repository = "https://github.com/Mattbusel/mavlink-tlog"
homepage = "https://github.com/Mattbusel/mavlink-tlog"
documentation = "https://docs.rs/mavlink-tlog"
readme = "README.md"
keywords = ["mavlink", "tlog", "drone", "telemetry", "flight-log"]
categories = ["aerospace::drones", "aerospace::protocols", "parser-implementations", "no-std"]
exclude = ["tests/data/*.json", "tests/data/external", ".github", "interop"]

[features]
default = ["std"]
## Streaming `TlogReader` / `TlogWriter` over `std::io` and `LinkStats`.
std = []

[dependencies]

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
